name: Deploy license to gist

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Deploy ZettaScale ICLA to Gist
        run: |
          jq \
            --arg icla "$(cat 2025.11.41-ZS-ICLA.md)" \
            --arg metadata "$(cat metadata)" \
            '.files."2025.11.41-ZS-ICLA.md".content = $icla |
            .files."metadata".content = $metadata' \
            gist-input-template.json > input-file.json

          echo "Deploying ICLA to Gist..."
          gh api \
          --method PATCH \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          /gists/${GIST_ID} \
          --input input-file.json
        env:
          GIST_ID: ${{ secrets.ZETTASCALE_BOT_ICLA_GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.ZETTASCALE_BOT_PERSONAL_ACCESS_TOKEN }}
